{# PROTOTYPE STAND-IN: "Who am I?" – replaced by Microsoft login later. #}
{# Pass `switcher_id` so the navbar and the welcome card get unique ids. #}
<form method="post" action="{% url 'accounts:switch_user' %}" class="d-flex align-items-center gap-2 {{ switcher_class }}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label for="{{ switcher_id }}" class="switcher-label small text-nowrap mb-0">Who am I?</label>
  <select id="{{ switcher_id }}" name="user_id" class="form-select form-select-sm" onchange="this.form.submit()">
    <option value="">— choose a person —</option>
    {% regroup switcher_users by role_label as role_groups %}
    {% for group in role_groups %}
      <optgroup label="{{ group.grouper }}">
        {% for u in group.list %}
          <option value="{{ u.pk }}" {% if u.pk == user.pk %}selected{% endif %}>
            {{ u }}{% if u.is_delegate %} (delegate){% endif %}{% if u.department %} – {{ u.department }}{% endif %}
          </option>
        {% endfor %}
      </optgroup>
    {% endfor %}
  </select>
  <noscript><button class="btn btn-sm btn-primary">Go</button></noscript>
</form>
